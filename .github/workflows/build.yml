# Builds tracko for Windows, macOS (Apple Silicon) and Linux (x64 + ARM).
# Pushes to main, pull requests and manual runs build the installers as artifacts.
# A tag like v0.2.0 also creates a draft GitHub release with every installer and the
# signed latest.json feed the in-app updater reads once the release is published.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Pull requests from forks get no secrets, so build them without the signed updater files.
      - name: Skip updater signing without the key
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "::error::A release needs the TAURI_SIGNING_PRIVATE_KEY secret, or installed copies can't update to it."
            exit 1
          fi
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.json
          echo "EXTRA_ARGS=--config no-updater.json" >> "$GITHUB_ENV"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('tracko {0}', github.ref_name) || '' }}
          releaseBody: 'Installers for Windows, macOS and Linux. Existing installs update from inside the app once this release is published.'
          releaseDraft: true
          args: --target ${{ matrix.target }} ${{ env.EXTRA_ARGS }}

      - uses: actions/upload-artifact@v4
        with:
          name: tracko-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: warn
